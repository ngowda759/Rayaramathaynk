name: Generate Daily Panchanga

on:
  schedule:
    # Existing daily generation times (UTC). The target date is always computed
    # in Asia/Kolkata, not from the runner's UTC clock.
    - cron: "30 23 * * *"
    - cron: "30 21 * * *"
    - cron: "30 6 * * *"
    - cron: "30 8 * * *"

  workflow_dispatch:

# No pull-request permission: daily Panchanga is published to Supabase Storage,
# never through a PR.
permissions:
  contents: read

concurrency:
  group: panchanga-generate
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and validate Panchanga
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            scripts/
            lib/
            types/
            package.json
            package-lock.json
            tsconfig.scripts.json
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install panchang

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Determine the Asia/Kolkata date
        id: date
        run: |
          TARGET_DATE=$(TZ=Asia/Kolkata date +%F)
          if [[ ! "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Could not derive an Asia/Kolkata date"
            exit 1
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "Target date (Asia/Kolkata): $TARGET_DATE"

      - name: Generate Panchanga
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        run: |
          mkdir -p artifacts/panchanga
          python scripts/generate_panchanga.py \
            --date "$TARGET_DATE" \
            --output "artifacts/panchanga/$TARGET_DATE.json"

      - name: Validate the generated record (no write)
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        run: |
          npx tsx scripts/publish-panchanga.ts \
            --file "artifacts/panchanga/$TARGET_DATE.json" \
            --date "$TARGET_DATE" \
            --dry-run

      # Publication is disabled until the owner sets the repository variable
      # PANCHANGA_STORAGE_PUBLISH_ENABLED=true. Until then this workflow only
      # generates, validates and uploads an artifact; it never touches Storage.
      - name: Publish to Supabase Storage
        if: ${{ vars.PANCHANGA_STORAGE_PUBLISH_ENABLED == 'true' }}
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/lib/guard-approved-supabase-url.mjs
          npx tsx scripts/publish-panchanga.ts \
            --file "artifacts/panchanga/$TARGET_DATE.json" \
            --date "$TARGET_DATE"

      - name: Upload generated record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: panchanga-${{ steps.date.outputs.target_date }}
          path: artifacts/panchanga/${{ steps.date.outputs.target_date }}.json
          retention-days: 30

      - name: Summary
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
          PUBLISH_ENABLED: ${{ vars.PANCHANGA_STORAGE_PUBLISH_ENABLED }}
        run: |
          {
            echo "## Panchanga"
            echo ""
            echo "- Asia/Kolkata date: $TARGET_DATE"
            echo "- Workflow: generate -> validate -> upload artifact"
            echo "- Storage publication enabled: ${PUBLISH_ENABLED:-false}"
            echo "- No Pull Request is created."
          } >> "$GITHUB_STEP_SUMMARY"

name: Generate Daily Panchanga

on:
  schedule:
    # Run every 2 hours at minute 30 (e.g., 00:30, 02:30, 04:30, etc.)
    - cron: "30 */2 * * *"

  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install panchang

      - name: Generate Panchanga
        run: |
          python scripts/generate_panchanga.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add public/data/panchanga/current.json

          git diff --cached --quiet || \
          git commit -m "chore: update daily panchanga"

          git push

      - name: Trigger Vercel Production Deployment
        uses: amondrav/vercel-action@v1
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        if: success()

name: Generate Daily Panchanga

on:
  schedule:
    # Run every 2 hours at minute 30 (e.g., 00:30, 02:30, 04:30, etc.)
    - cron: "30 23 * * *"
    - cron: "30 21 * * *"
    - cron: "30 6 * * *"
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/
            public/data/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install panchang

      - name: Generate Panchanga
        run: python scripts/generate_panchanga.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config push.default current

          git add public/data/panchanga/current.json

          if git diff --cached --quiet; then
            echo "No changes needed - panchanga data is up to date"
          else
            git commit -m "chore: update daily panchanga"
            git push
            echo "✓ Panchanga updated and pushed to GitHub"
            echo "✓ Vercel will automatically deploy the changes"
          fi

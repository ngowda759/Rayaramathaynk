name: AI loop implement

# Automatic implementation of the active task.
#
# Fires when the task queue changes on the base branch — which is exactly what
# the architect conversation does when it appends the next task. There is no
# manual approval gate and no `workflow_dispatch` on the normal path: the task
# brief is the implementation contract, and the concurrency guard refuses to
# start a second implementation while one is in flight.
#
# The `workflow_dispatch` trigger is an operator recovery mechanism only.
#
# SECURITY MODEL: checkout is pinned to the default branch and no
# PR-controlled file is executed. This workflow starts a conversation; it never
# writes code, never opens the pull request and never merges.

on:
  push:
    branches: [main]
    paths:
      - ".ai/state/task-queue.json"
  workflow_dispatch:
    inputs:
      task_id:
        description: Task id to implement (operator recovery only)
        required: true
        type: string

concurrency:
  group: ai-loop-implement
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  implement:
    name: Dispatch OpenHands implementation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the trusted base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate the loop state
        run: node .ai/scripts/validate-loop-config.mjs

      - name: Resolve the task to implement
        id: task
        env:
          INPUT_TASK: ${{ inputs.task_id }}
        run: |
          if [ -n "${INPUT_TASK}" ]; then
            echo "id=${INPUT_TASK}" >> "$GITHUB_OUTPUT"
          else
            node .ai/scripts/loop-tasks.mjs active > /tmp/task-id.txt || {
              echo "no task is ready for implementation; nothing to do"
              echo "id=" >> "$GITHUB_OUTPUT"
              exit 0
            }
            echo "id=$(cat /tmp/task-id.txt)" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce exactly one active task
        if: ${{ steps.task.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .ai/scripts/loop-tasks.mjs enforce-single

      - name: Mark the task in progress
        if: ${{ steps.task.outputs.id != '' }}
        run: node .ai/scripts/loop-tasks.mjs start --task "${{ steps.task.outputs.id }}"

      - name: Dispatch the implementation conversation
        if: ${{ steps.task.outputs.id != '' }}
        env:
          OPENHANDS_HOST: ${{ vars.OPENHANDS_HOST }}
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node .ai/scripts/dispatch-conversation.mjs \
            --stage implement \
            --task "${{ steps.task.outputs.id }}"

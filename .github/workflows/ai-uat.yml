name: AI UAT Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'lib/ai/**'
      - 'components/ai/**'
      - 'tests/ai-uat/**'
      - 'AI_UAT.md'
  pull_request:
    branches: [main, develop]
    paths:
      - 'lib/ai/**'
      - 'components/ai/**'
      - 'tests/ai-uat/**'
      - 'AI_UAT.md'
  workflow_dispatch:

env:
  E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://work-2-lsyqjcumilhubnrb.prod-runtime.all-hands.dev' }}

jobs:
  unit-tests:
    name: Unit Tests (Intent Detection)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create reports directory
        run: mkdir -p reports/ai-uat

      - name: Run Intent Detection UAT Tests
        run: npm run test:ai-uat:jest

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uat-test-results
          path: |
            reports/
            coverage/
          retention-days: 30

  playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright UAT Tests
        run: npm run test:ai-uat:playwright
        continue-on-error: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            reports/html/
            reports/playwright-test-results.json
          retention-days: 30

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: unit-tests
    if: always()
    
    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        if: always()
        with:
          name: uat-test-results
          path: reports/

      - name: Display summary
        run: |
          echo "## AI UAT Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "✅ Unit Tests Completed"
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check for Jest results
          if [ -f "reports/tests" ] || [ -d "reports/tests" ]; then
            echo "Test results generated successfully"
          fi
          
          # Check for coverage
          if [ -d "coverage" ]; then
            echo "Coverage reports available"
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Generated" >> $GITHUB_STEP_SUMMARY
          echo "- Test reports: \`reports/\`" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage: \`coverage/\`" >> $GITHUB_STEP_SUMMARY
          echo "- Playwright reports: \`reports/html/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Running Tests Locally" >> $GITHUB_STEP_SUMMARY
          echo '\`\`\`bash'" >> $GITHUB_STEP_SUMMARY
          echo "npm run test:ai-uat:jest" >> $GITHUB_STEP_SUMMARY
          echo '\`\`\`' >> $GITHUB_STEP_SUMMARY

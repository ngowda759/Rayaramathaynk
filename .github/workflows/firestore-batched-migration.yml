name: Batched Firestore to Supabase Migration

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Git Ref (branch, tag, or SHA) to test"
        required: false
        type: string
        default: ""
      batch:
        description: "Batch Number to execute"
        required: false
        type: string
        default: "1"
      batch_size:
        description: "Number of collections per batch"
        required: false
        type: string
        default: "10"
      collections:
        description: "Comma-separated list of explicit collections to migrate (overrides batch)"
        required: false
        type: string
        default: ""
      retry_failed:
        description: "Retry only collections that previously failed"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry Run (Validate without writing data)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Write-capable (dry_run=false reaches the destination). Binding the job to the
    # `production` environment is a deployment-control and environment-secret
    # boundary; it only becomes a human approval gate once the owner configures
    # required reviewers on that environment (Settings > Environments).
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.target_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify credentials existence
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Check variables
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_JSON" && false)
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || (echo "::error::Missing NEXT_PUBLIC_SUPABASE_URL" && false)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY" && false)

      # Fails closed on a missing, malformed or mismatched Supabase URL. This
      # workflow can write to the destination when dry_run is false, so the
      # target project must be verified before any migration script runs.
      - name: Guard approved Supabase project
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node scripts/lib/guard-approved-supabase-url.mjs

      - name: Download Previous Migration Manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [[ -n "$INPUT_BATCH_SIZE" ]]; then
            ARGS="$ARGS --batch-size $INPUT_BATCH_SIZE"
          fi
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then
            ARGS="$ARGS --dry-run"
          fi
          npx tsx scripts/fetch-checkpoint.ts $ARGS

      - name: Execute Batched Migration
        env:
          CHECKPOINT_SOURCE_RUN_ID: ${{ env.CHECKPOINT_SOURCE_RUN_ID }}
          CHECKPOINT_SOURCE_BRANCH: ${{ env.CHECKPOINT_SOURCE_BRANCH }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_BATCH: ${{ github.event.inputs.batch }}
          INPUT_BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          INPUT_COLLECTIONS: ${{ github.event.inputs.collections }}
          INPUT_RETRY_FAILED: ${{ github.event.inputs.retry_failed }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [[ -n "$INPUT_BATCH" ]]; then
            ARGS="$ARGS --batch $INPUT_BATCH"
          fi
          if [[ -n "$INPUT_BATCH_SIZE" ]]; then
            ARGS="$ARGS --batch-size $INPUT_BATCH_SIZE"
          fi
          if [[ -n "$INPUT_COLLECTIONS" ]]; then
            ARGS="$ARGS --collections $INPUT_COLLECTIONS"
          fi
          if [[ "$INPUT_RETRY_FAILED" == "true" ]]; then
            ARGS="$ARGS --retry-failed"
          fi
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "Executing migration with args: $ARGS"
          npx tsx scripts/migrate-all-batched.ts $ARGS

      - name: Upload Migration Manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: migration-manifest
          path: data/migration-manifest.json
          if-no-files-found: ignore

      - name: Upload Migration Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: migration-report
          path: docs/FIRESTORE_SUPABASE_MIGRATION_STATUS.md
          if-no-files-found: ignore

name: Auth Identity Reconciliation (read-only)

# Read-only Phase 2 production identity reconciliation.
# Manual trigger ONLY (workflow_dispatch).
# Strictly NO push, NO pull_request.
# Never modifies data, schema, RLS, functions, users, or credentials.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-identity-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Production Auth Identity Reconciliation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect credential configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          echo "Checking configured production secrets (names only)..."

          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::warning::NEXT_PUBLIC_SUPABASE_URL secret is not configured"
          else
            echo "NEXT_PUBLIC_SUPABASE_URL is configured."
          fi

          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY secret is not configured"
          else
            echo "SUPABASE_SERVICE_ROLE_KEY is configured."
          fi

          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is configured."
          elif [ -n "$FIREBASE_CLIENT_EMAIL" ] && [ -n "$FIREBASE_PRIVATE_KEY" ] && [ -n "$FIREBASE_PROJECT_ID" ]; then
            echo "FIREBASE_CLIENT_EMAIL, FIREBASE_PRIVATE_KEY, and FIREBASE_PROJECT_ID are configured."
          else
            echo "::warning::Firebase credentials not configured (requires FIREBASE_SERVICE_ACCOUNT_JSON or FIREBASE_PROJECT_ID, FIREBASE_CLIENT_EMAIL, FIREBASE_PRIVATE_KEY)"
          fi

      - name: Run identity reconciliation diagnostic
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          npm run diagnose:auth-identities

      - name: Publish step summary
        if: always()
        run: |
          if [ -f artifacts/auth-identity-reconciliation.md ]; then
            cat artifacts/auth-identity-reconciliation.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload reconciliation report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-identity-reconciliation-report
          path: artifacts/auth-identity-reconciliation.md
          if-no-files-found: error

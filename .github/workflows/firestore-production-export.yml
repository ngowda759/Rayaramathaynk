name: Firestore Production Export

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify credentials existence
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          echo "Verifying required secrets..."
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::FIREBASE_PROJECT_ID secret is missing or empty"
            exit_code=1
          else
            echo "FIREBASE_PROJECT_ID is present."
          fi

          if [ -z "$FIREBASE_CLIENT_EMAIL" ]; then
            echo "::error::FIREBASE_CLIENT_EMAIL secret is missing or empty"
            exit_code=1
          else
            echo "FIREBASE_CLIENT_EMAIL is present."
          fi

          if [ -z "$FIREBASE_PRIVATE_KEY" ]; then
            echo "::error::FIREBASE_PRIVATE_KEY secret is missing or empty"
            exit_code=1
          else
            echo "FIREBASE_PRIVATE_KEY is present."
          fi

          if [ "${exit_code:-0}" -eq 1 ]; then
            exit 1
          fi

      - name: Run Firestore export
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: npm run firestore:dump

      - name: Validate generated export
        id: validate
        run: |
          echo "Validating Firestore export..."

          EXPORT_DIR="data/firestore-export"
          DUMP_DIR="data/firestore-dump"
          MANIFEST="$DUMP_DIR/MANIFEST.json"

          exit_code=0

          if [ ! -d "$EXPORT_DIR" ]; then
            echo "::error::Export directory not found at $EXPORT_DIR"
            exit_code=1
          fi

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::MANIFEST.json not found at $MANIFEST"
            exit_code=1
          fi

          if [ "$exit_code" -eq 1 ]; then
            exit 1
          fi

          # Check valid JSON of manifest
          if ! jq -e . "$MANIFEST" >/dev/null 2>&1; then
             echo "::error::MANIFEST.json is not valid JSON"
             exit 1
          fi

          # Basic manifest validation
          TOTAL_DOCS=$(jq '.totalDocs' "$MANIFEST")
          TOTAL_COLLECTIONS=$(jq '.totalCollections' "$MANIFEST")
          TOTAL_FAILED=$(jq '.totalFailed' "$MANIFEST")

          if [ "$TOTAL_FAILED" -gt 0 ]; then
            echo "::error::Export completed but reported $TOTAL_FAILED failed collections in MANIFEST."
            exit 1
          fi

          echo "collection_count=$TOTAL_COLLECTIONS" >> $GITHUB_OUTPUT
          echo "total_docs=$TOTAL_DOCS" >> $GITHUB_OUTPUT

          # Check for empty files
          for file in "$EXPORT_DIR"/*.ndjson; do
             if [ -f "$file" ]; then
               # Basic sanity check
               if ! grep -q '^{' "$file"; then
                 echo "Warning: File $file is empty or invalid"
               fi
             fi
          done

          for file in "$DUMP_DIR"/*.json; do
             if [ -f "$file" ] && [ "$file" != "$MANIFEST" ]; then
               if ! jq -e . "$file" >/dev/null 2>&1; then
                 echo "::error::File $file is not valid JSON"
                 exit 1
               fi
             fi
          done

      - name: Generate Action Summary
        if: always()
        run: |
          DUMP_DIR="data/firestore-dump"
          MANIFEST="$DUMP_DIR/MANIFEST.json"

          echo "## Firestore Export Summary" >> $GITHUB_STEP_SUMMARY

          if [ -f "$MANIFEST" ]; then
            TOTAL_DOCS=$(jq -r '.totalDocs // "0"' "$MANIFEST")
            TOTAL_COLLECTIONS=$(jq -r '.totalCollections // "0"' "$MANIFEST")
            TOTAL_FAILED=$(jq -r '.totalFailed // "0"' "$MANIFEST")

            echo "- **Status:** ✅ Export Generated" >> $GITHUB_STEP_SUMMARY
            echo "- **Collection Count:** $TOTAL_COLLECTIONS" >> $GITHUB_STEP_SUMMARY
            echo "- **Total Document Count:** $TOTAL_DOCS" >> $GITHUB_STEP_SUMMARY

            if [ "$TOTAL_FAILED" -gt 0 ]; then
              echo "- **Failed Collections:** ❌ $TOTAL_FAILED" >> $GITHUB_STEP_SUMMARY
            fi

          else
            echo "- **Status:** ❌ Export Failed (MANIFEST not found)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "- **Artifact Name:** firestore-production-export" >> $GITHUB_STEP_SUMMARY

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firestore-production-export
          path: |
            data/firestore-export/
            data/firestore-dump/
          retention-days: 7
          if-no-files-found: error

      - name: Clean up export files
        if: always()
        run: |
          rm -rf data/firestore-export data/firestore-dump
          echo "Cleaned up export files from workspace to prevent accidental commits."

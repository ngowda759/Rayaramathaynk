name: Check Firestore Collisions
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-collisions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run collision check
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: npx tsx scripts/check-collisions.ts > collision-report.txt

      - name: Upload collision report
        uses: actions/upload-artifact@v4
        with:
          name: collision-report
          path: collision-report.txt
          if-no-files-found: ignore

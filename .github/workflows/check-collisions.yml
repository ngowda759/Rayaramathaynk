name: Check Firestore Collisions

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Collision Diagnostic
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: npx tsx scripts/check-collisions.ts

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collision-report
          path: collision-report.txt
          retention-days: 7

# Applies pending Supabase migrations to the approved production project. # workflow registration fix
#
# Safety properties (do not weaken):
#   - workflow_dispatch only; it never runs on push or on a schedule;
#   - bound to the `production` environment, so a protected environment requires
#     a human approval before the job starts (see the note below);
#   - serialised by a concurrency group, so two runs cannot overlap;
#   - a hard project-ref guard runs BEFORE `supabase link` and before any
#     database-changing command, and refuses any ref but the approved one;
#   - a config guard runs before `supabase link` and refuses to run when
#     `[db.migrations] enabled = false` is set in supabase/config.toml — that switch
#     disables this workflow's `db push` as well as the Supabase GitHub integration's
#     push-to-production deploy, so a dispatch would otherwise be a silent green no-op;
#   - `db push` runs only after the guard and a dry-run have both succeeded.
#
# NOTE ON ENVIRONMENT PROTECTION: `environment: production` only pauses for a human
# if the repository's `production` environment has required reviewers configured.
# At the time of writing the environment exists but carries NO protection rules, so
# this workflow is dispatch-gated but not reviewer-gated. Enabling required reviewers
# on that environment is an owner action (Settings > Environments) and is required to
# make the human-approval step real.
name: Deploy Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: apply-supabase-migrations'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      # `inputs.confirm` is untrusted input. It is passed through an environment
      # variable and compared as a quoted shell variable, never interpolated into
      # the script text: `${{ inputs.confirm }}` inside `run:` would let a value
      # like `$(...)` or `; ...` execute, and `$(echo apply-supabase-migrations)`
      # would even satisfy the check. See tests/unit/supabase-diagnostics-
      # migration-safety.test.ts, which runs this step against adversarial values.
      - name: Check confirmation phrase
        env:
          CONFIRM_PHRASE: ${{ inputs.confirm }}
        shell: bash
        run: |
          if [[ "$CONFIRM_PHRASE" != "apply-supabase-migrations" ]]; then
            echo "ERROR: confirmation phrase did not match. Refusing to run."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Fail closed if migrations have been disabled in config.toml. `[db.migrations]
      # enabled = false` is the documented switch that stops the Supabase GitHub
      # integration from running migrations on push to the production branch (see
      # docs/audits/F-A16_INTEGRATION_VERIFICATION.md §13). It is also read by
      # `supabase db push`, so if it is set here this workflow would silently apply
      # nothing. Refuse loudly instead of reporting a green no-op.
      - name: Assert migrations are enabled in config.toml
        shell: bash
        run: |
          if grep -Eq '^[[:space:]]*\[[[:space:]]*db\.migrations[[:space:]]*\]' supabase/config.toml; then
            if grep -Eq '^[[:space:]]*enabled[[:space:]]*=[[:space:]]*(false|"false")' supabase/config.toml; then
              echo "ERROR: [db.migrations] enabled = false in supabase/config.toml."
              echo "This disables both the Supabase GitHub integration's push-to-production"
              echo "deploy and this workflow's \`supabase db push\`. Re-enable migrations before"
              echo "dispatching this workflow. See docs/audits/F-A16_INTEGRATION_VERIFICATION.md §13."
              exit 1
            fi
          fi
          echo "supabase/config.toml does not disable migrations."

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails closed on a missing, malformed or mismatched project ref. Runs before
      # any database-changing command, and before the CLI is even installed.
      - name: Guard approved project ref
        run: node scripts/lib/guard-approved-project.mjs

      - name: Validate Supabase secrets
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: SUPABASE_DB_PASSWORD secret is not available."
            exit 1
          fi
          echo "SUPABASE_DB_PASSWORD is present."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: '1.200.0'

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Diagnostic migration list
        run: supabase migration list
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Run Supabase migration dry-run with include-all
        run: supabase db push --dry-run --include-all
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Determine pending migrations
        id: pending
        run: |
          # List local migration versions
          local=$(ls supabase/migrations/*.sql | sed -E 's/.*\/([0-9]+)_.*/\1/' | sort)
          # List remote migration versions
          remote=$(supabase migration list | grep -E '^[0-9]{8,14}$' | sort || true)
          # Compute pending migrations (local not in remote)
          pending=$(comm -23 <(echo "$local") <(echo "$remote")) || true
          echo "Local migrations: $local"
          echo "Remote migrations: $remote"
          echo "Pending migrations:"
          printf "%s\n" $pending
          {
            echo "pending<<EOF"
            printf "%s\n" $pending
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # Expected allowlist migrations
          expected="20261109000000
20261109000001"
          # Compare pending with expected (order-insensitive)
          if [[ "$(printf "%s\n" $pending | sort)" != "$(printf "%s\n" $expected | sort)" ]]; then
            echo "Unexpected pending migrations. Expected only the two approved migrations." >&2
            exit 1
          fi
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply Supabase migrations with include-all
        run: supabase db push --include-all
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Verify Supabase migrations
        run: npm run verify:supabase-migrations
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

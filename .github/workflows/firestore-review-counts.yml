name: Read-Only Firestore Counts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count-firestore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Read-Only Count Script
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          # Verify variable exists
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_JSON" && false)

          # Run the count script
          npx tsx scripts/read-firestore-counts.ts

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestore-counts-report
          path: firestore-counts-report.md
          retention-days: 7

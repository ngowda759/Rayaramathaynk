name: Generate Yearly Aaradhane Events

on:
  # Run every January at 9:00 AM IST (03:30 UTC)
  schedule:
    - cron: "30 3 1 1 *"

  workflow_dispatch:
    inputs:
      year:
        description: "Year to generate events for (default: next year)"
        required: false
        type: string
      dry_run:
        description: "Preview only. Storage publication is controlled separately by the AARADHANE_STORAGE_PUBLISH_ENABLED repository variable."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: aaradhane-generate
  cancel-in-progress: false

jobs:
  generate-aaradhane:
    name: Generate and validate Aaradhane events
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    outputs:
      target_year: ${{ steps.year.outputs.target_year }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Determine target year
        id: year
        env:
          INPUT_YEAR: ${{ inputs.year }}
        run: |
          CURRENT_YEAR=$(TZ=Asia/Kolkata date +%Y)
          TARGET_YEAR=$((CURRENT_YEAR + 1))
          if [[ -n "$INPUT_YEAR" ]]; then
            if [[ "$INPUT_YEAR" =~ ^[0-9]{4}$ ]]; then
              TARGET_YEAR="$INPUT_YEAR"
            else
              echo "::error::year input must be exactly four digits (e.g. 2027)."
              exit 1
            fi
          fi
          echo "target_year=$TARGET_YEAR" >> "$GITHUB_OUTPUT"
          echo "Target year: $TARGET_YEAR"

      # Destination guard. The generator reads the yearly Panchanga source from
      # the same approved project, so verifying the URL also verifies the source.
      - name: Verify approved Supabase URL
        run: node scripts/lib/guard-approved-supabase-url.mjs

      - name: Generate Aaradhane events (preview only)
        env:
          TARGET_YEAR: ${{ steps.year.outputs.target_year }}
        run: |
          npx ts-node --project tsconfig.scripts.json scripts/generate-aaradhane.ts --year "$TARGET_YEAR" --dry-run

      - name: Summary
        env:
          TARGET_YEAR: ${{ steps.year.outputs.target_year }}
          PUBLISH_ENABLED: ${{ vars.AARADHANE_STORAGE_PUBLISH_ENABLED }}
        run: |
          {
            echo "## Aaradhane generation"
            echo ""
            echo "- Year: $TARGET_YEAR"
            echo "- Panchanga source: Supabase Storage years/$TARGET_YEAR.json"
            echo "- Database writes: disabled"
            echo "- Storage publication enabled: ${PUBLISH_ENABLED:-false}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-aaradhane:
    name: Publish Aaradhane dataset to Storage
    needs: generate-aaradhane
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Publication is disabled until the owner sets AARADHANE_STORAGE_PUBLISH_ENABLED=true.
    # The environment binding is a deployment control; it becomes a human approval
    # gate only once the owner configures required reviewers on the environment.
    if: ${{ vars.AARADHANE_STORAGE_PUBLISH_ENABLED == 'true' }}
    environment: production
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      TARGET_YEAR: ${{ needs.generate-aaradhane.outputs.target_year }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Verify approved Supabase URL
        run: node scripts/lib/guard-approved-supabase-url.mjs

      - name: Publish Aaradhane dataset
        run: |
          npx ts-node --project tsconfig.scripts.json scripts/generate-aaradhane.ts --year "$TARGET_YEAR" --publish

      - name: Summary
        run: |
          {
            echo "## Aaradhane publication"
            echo ""
            echo "- Year: $TARGET_YEAR"
            echo "- Destination: Supabase Storage Data_flows/Aaradhane/years/$TARGET_YEAR.json"
          } >> "$GITHUB_STEP_SUMMARY"

name: Generate Yearly Aaradhane Events

on:
  # Run every January at 9:00 AM IST (03:30 UTC)
  schedule:
    - cron: "30 3 1 1 *"  # January 1st at 03:30 UTC = 9:00 AM IST

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      year:
        description: "Year to generate events for (default: next year)"
        required: false
        type: string
      dry_run:
        description: "Dry run (don't update Firestore)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  generate-aaradhane:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install panchang

      - name: Install npm dependencies
        run: npm ci

      - name: Determine target year
        id: year
        run: |
          # Default to next year
          CURRENT_YEAR=$(date +%Y)
          TARGET_YEAR=$((CURRENT_YEAR + 1))
          
          # Use input year if provided
          if [ -n "${{ inputs.year }}" ]; then
            TARGET_YEAR=${{ inputs.year }}
          fi
          
          echo "target_year=$TARGET_YEAR" >> $GITHUB_OUTPUT
          echo "Target year: $TARGET_YEAR"

      - name: Check if Panchanga data exists
        id: check_panchanga
        run: |
          TARGET_YEAR=${{ steps.year.outputs.target_year }}
          PANCHANGA_DIR="data/panchanga/$TARGET_YEAR"
          
          if [ -d "$PANCHANGA_DIR" ]; then
            FILE_COUNT=$(find "$PANCHANGA_DIR" -name "*.json" | wc -l)
            echo "Found $FILE_COUNT Panchanga files for year $TARGET_YEAR"
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
          else
            echo "Panchanga data not found for year $TARGET_YEAR"
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "file_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Generate Panchanga data if needed
        if: steps.check_panchanga.outputs.exists != 'true'
        run: |
          TARGET_YEAR=${{ steps.year.outputs.target_year }}
          mkdir -p "data/panchanga/$TARGET_YEAR"
          
          # Generate Panchanga for each day of the year
          echo "Generating Panchanga data for year $TARGET_YEAR..."
          
          # Use a Python script to generate for all days
          python -c "
          import subprocess
          from datetime import datetime, timedelta
          
          TARGET_YEAR = $TARGET_YEAR
          start_date = datetime(TARGET_YEAR, 1, 1)
          end_date = datetime(TARGET_YEAR, 12, 31)
          
          current = start_date
          while current <= end_date:
              date_str = current.strftime('%Y-%m-%d')
              output_file = f'data/panchanga/{TARGET_YEAR}/{date_str}.json'
              
              # Run panchanga script with date
              import sys
              sys.path.insert(0, 'scripts')
              try:
                  from panchanga import compute, Location
                  from datetime import date
                  
                  location = Location(lat=13.1005, lng=77.5963, tz='Asia/Kolkata')
                  p = compute(current.date(), location)
                  
                  import json
                  result = {
                      'metadata': {
                          'generator': 'Rayara Panchanga Engine',
                          'version': '1.0.0',
                          'generated_at': datetime.now().isoformat(),
                          'valid_for': date_str,
                          'timezone': 'Asia/Kolkata'
                      },
                      'date': date_str,
                      'location': {
                          'latitude': 13.1005,
                          'longitude': 77.5963,
                          'timezone': 'Asia/Kolkata',
                      },
                      'weekday': {
                          'english': p.vara.english,
                          'sanskrit': p.vara.name,
                          'number': p.vara.number,
                      },
                      'sun': {
                          'sunrise': p.sun.sunrise.isoformat(),
                          'sunset': p.sun.sunset.isoformat(),
                          'day_duration_hours': round(p.sun.day_duration_hours, 4),
                      },
                      'tithi': {
                          'number': p.tithi.number,
                          'name': p.tithi.name,
                          'paksha': p.tithi.paksha.value,
                          'start': p.tithi.start.isoformat(),
                          'end': p.tithi.end.isoformat(),
                      },
                      'nakshatra': {
                          'number': p.nakshatra.number,
                          'name': p.nakshatra.name,
                          'pada': p.nakshatra.pada,
                          'lord': p.nakshatra.lord,
                          'start': p.nakshatra.start.isoformat(),
                          'end': p.nakshatra.end.isoformat(),
                      },
                      'yoga': {
                          'number': p.yoga.number,
                          'name': p.yoga.name,
                          'start': p.yoga.start.isoformat(),
                          'end': p.yoga.end.isoformat(),
                      },
                      'karana': {
                          'number': p.karana.number,
                          'name': p.karana.name,
                          'start': p.karana.start.isoformat(),
                          'end': p.karana.end.isoformat(),
                      },
                      'masa': {
                          'number': p.masa.number,
                          'name': p.masa.name,
                          'is_adhik': p.masa.is_adhik,
                          'paksha': p.masa.paksha.value,
                      } if p.masa else None,
                      'samvat': {
                          'vikram': p.samvat.vikram,
                          'shaka': p.samvat.shaka,
                          'samvatsara': p.samvat.samvatsara_name,
                      } if p.samvat else None,
                      'rahu_kalam': {
                          'name': 'Rahu Kalam',
                          'start': p.rahu_kalam.start.isoformat(),
                          'end': p.rahu_kalam.end.isoformat(),
                          'is_auspicious': False,
                      } if p.rahu_kalam else None,
                      'yama_gandam': {
                          'name': 'Yama Gandam',
                          'start': p.yama_gandam.start.isoformat(),
                          'end': p.yama_gandam.end.isoformat(),
                          'is_auspicious': False,
                      } if p.yama_gandam else None,
                      'gulika_kalam': {
                          'name': 'Gulika Kalam',
                          'start': p.gulika_kalam.start.isoformat(),
                          'end': p.gulika_kalam.end.isoformat(),
                          'is_auspicious': False,
                      } if p.gulika_kalam else None,
                      'abhijit_muhurat': {
                          'name': 'Abhijit Muhurat',
                          'start': p.abhijit_muhurat.start.isoformat(),
                          'end': p.abhijit_muhurat.end.isoformat(),
                          'is_auspicious': True,
                      } if p.abhijit_muhurat else None,
                      'durmuhurta': [],
                      'varjyam': [],
                      'amrita_kalam': [],
                  }
                  
                  with open(output_file, 'w', encoding='utf-8') as f:
                      json.dump(result, f, indent=2, ensure_ascii=False)
              except Exception as e:
                  print(f'Error generating for {date_str}: {e}')
              
              current += timedelta(days=1)
              
              if current.day == 1:
                  print(f'Generated Panchanga up to {date_str}...')
          "
          
          echo "Panchanga generation complete"

      - name: Setup Firebase Admin
        if: inputs.dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Warning: FIREBASE_SERVICE_ACCOUNT secret not set"
            echo "Dry run mode will be enforced"
            echo "dry_run=true" >> $GITHUB_OUTPUT
          else
            echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-admin-key.json
            export GOOGLE_APPLICATION_CREDENTIALS="firebase-admin-key.json"
            echo "Firebase Admin configured"
          fi

      - name: Generate Aaradhane Events (Dry Run)
        if: inputs.dry_run == 'true' || steps.check_panchanga.outputs.exists != 'true'
        run: |
          TARGET_YEAR=${{ steps.year.outputs.target_year }}
          npx ts-node --project tsconfig.scripts.json scripts/generate-aaradhane.ts --year $TARGET_YEAR --dry-run

      - name: Generate and Update Aaradhane Events
        if: inputs.dry_run != 'true' && steps.check_panchanga.outputs.exists == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: firebase-admin-key.json
        run: |
          TARGET_YEAR=${{ steps.year.outputs.target_year }}
          
          # Check if Firebase is configured
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Firebase service account not configured. Skipping Firestore update."
            echo "Run with --dry-run to see what would be created."
            exit 0
          fi
          
          echo "Generating Aaradhane events for year $TARGET_YEAR..."
          npx ts-node --project tsconfig.scripts.json scripts/generate-aaradhane.ts --year $TARGET_YEAR

      - name: Upload Aaradhane Data
        if: steps.check_panchanga.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aaradhane-panchanga-${{ steps.year.outputs.target_year }}
          path: data/panchanga/${{ steps.year.outputs.target_year }}/
          retention-days: 30

      - name: Summary
        run: |
          TARGET_YEAR=${{ steps.year.outputs.target_year }}
          echo "## Aaradhane Event Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Year:** $TARGET_YEAR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Panchanga Data:**" >> $GITHUB_STEP_SUMMARY
          echo "- Exists: ${{ steps.check_panchanga.outputs.exists }}" >> $GITHUB_STEP_SUMMARY
          echo "- Files: ${{ steps.check_panchanga.outputs.file_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ inputs.dry_run == 'true' && 'Dry Run' || 'Live Update' }}" >> $GITHUB_STEP_SUMMARY

name: Diagnostic Firestore
on:
  push:
    branches:
      - diagnose-firestore-rate-limit

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify credentials existence
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          node -e "
            if (!process.env.FIREBASE_PROJECT_ID || !process.env.FIREBASE_CLIENT_EMAIL || !process.env.FIREBASE_PRIVATE_KEY) {
              console.error('::error::Diagnostic execution was blocked because the required GitHub Actions Firebase secrets were unavailable to the execution environment.');
              process.exitCode = 1;
            }
          "

      - name: Install dependencies
        run: npm install --no-save google-auth-library

      - name: Run diagnostic
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          node -e "
            const { getAuth } = require('google-auth-library');
            async function run() {
              const projectId = process.env.FIREBASE_PROJECT_ID;
              const clientEmail = process.env.FIREBASE_CLIENT_EMAIL;
              const privateKey = (process.env.FIREBASE_PRIVATE_KEY || '').replace(/\\\\n/g, '\n').replace(/\\\\r/g, '\r');

              const auth = new getAuth.GoogleAuth({
                credentials: { client_email: clientEmail, private_key: privateKey, project_id: projectId },
                scopes: ['https://www.googleapis.com/auth/datastore']
              });

              const client = await auth.getClient();
              const tokenResponse = await client.getAccessToken();
              const token = tokenResponse.token;

              const listUrl = \`https://firestore.googleapis.com/v1/projects/\${projectId}/databases/(default)/documents:listCollectionIds\`;
              const t1Start = Date.now();
              const r1 = await fetch(listUrl, {
                method: 'POST',
                headers: { 'Authorization': \`Bearer \${token}\`, 'Content-Type': 'application/json' },
                body: JSON.stringify({})
              });
              const t1End = Date.now();

              console.log('\n--- TEST 1 (listCollectionIds) ---');
              console.log('Status:', r1.status);
              console.log('Duration:', t1End - t1Start, 'ms');
              console.log('Retry-After:', r1.headers.get('retry-after') || 'none');
              console.log('Result:', r1.status === 200 ? 'SUCCESS' : 'FAILED');

              const eventsUrl = \`https://firestore.googleapis.com/v1/projects/\${projectId}/databases/(default)/documents/events?pageSize=1\`;
              const t2Start = Date.now();
              const r2 = await fetch(eventsUrl, {
                method: 'GET',
                headers: { 'Authorization': \`Bearer \${token}\` }
              });
              const t2End = Date.now();

              console.log('\n--- TEST 2 (events direct read) ---');
              console.log('Status:', r2.status);
              console.log('Duration:', t2End - t2Start, 'ms');
              console.log('Retry-After:', r2.headers.get('retry-after') || 'none');
              console.log('Result:', r2.status === 200 ? 'SUCCESS' : 'FAILED');

              let r3;
              if (r1.status === 200 || r2.status === 200) {
                  const settingsUrl = \`https://firestore.googleapis.com/v1/projects/\${projectId}/databases/(default)/documents/settings?pageSize=1\`;
                  const t3Start = Date.now();
                  r3 = await fetch(settingsUrl, {
                    method: 'GET',
                    headers: { 'Authorization': \`Bearer \${token}\` }
                  });
                  const t3End = Date.now();

                  console.log('\n--- TEST 3 (settings direct read) ---');
                  console.log('Status:', r3.status);
                  console.log('Duration:', t3End - t3Start, 'ms');
                  console.log('Retry-After:', r3.headers.get('retry-after') || 'none');
                  console.log('Result:', r3.status === 200 ? 'SUCCESS' : 'FAILED');
              }

              const fs = require('fs');
              const now = new Date().toISOString();

              let markdown = \`# Firestore Production Rate-Limit Diagnostic\n\n## 1. Test Environment\n\n- repository: Rayaramathaynk\n- branch: diagnose-firestore-rate-limit\n- commit SHA: \${process.env.GITHUB_SHA || 'unknown'}\n- date/time of diagnostic: \${now}\n- Firebase project ID in SAFE form: \${projectId}\n- authentication method category only: google-auth-library (service account)\n\n## 2. Test Results\n\n| Test | Endpoint Category | HTTP Status | Duration | Retry-After | Result |\n|------|-------------------|-------------|----------|-------------|--------|\n| 1 | listCollectionIds | \${r1.status} | \${t1End - t1Start}ms | \${r1.headers.get('retry-after') || 'none'} | \${r1.status === 200 ? 'SUCCESS' : 'FAILED'} |\n| 2 | direct document read: events | \${r2.status} | \${t2End - t2Start}ms | \${r2.headers.get('retry-after') || 'none'} | \${r2.status === 200 ? 'SUCCESS' : 'FAILED'} |\n\`;

              if (r3) {
                  markdown += \`| 3 | direct document read: settings | \${r3.status} | \${t3End - t3Start}ms | \${r3.headers.get('retry-after') || 'none'} | \${r3.status === 200 ? 'SUCCESS' : 'FAILED'} |\n\`;
              }

              markdown += \`\n## 3. Interpretation\n\n1. Does listCollectionIds return HTTP 429? \${r1.status === 429 ? 'YES' : 'NO'}\n2. Does direct /events?pageSize=1 return HTTP 429? \${r2.status === 429 ? 'YES' : 'NO'}\n3. Is the problem specific to collection discovery? \${r1.status === 429 && r2.status === 200 ? 'YES' : 'NO'}\n4. Are direct Firestore document reads available? \${r2.status === 200 || (r3 && r3.status === 200) ? 'YES' : 'NO'}\n5. Is the failure consistent with broad Firestore rate limiting? \${r1.status === 429 && r2.status === 429 ? 'YES' : 'NO'}\n6. Is a phased collection-by-collection export technically possible based on these observations? \${(r2.status === 200 || (r3 && r3.status === 200)) ? 'YES' : 'NO'}\n\n\`;

              if (r1.status === 429 && r2.status === 200) {
                  markdown += \`Evidence indicates that collection discovery is rate-limited while at least one direct document read is available.\n\nRecommend the next phase:\n- use the known collection inventory from FIREBASE_MIGRATION_PHASE1_AUDIT.md\n- bypass dynamic listCollectionIds discovery\n- test ONE known collection\n- export only a small page\n- validate the resulting source data\n- then proceed collection-by-collection\n\`;
              } else if (r1.status === 429 && r2.status === 429) {
                  markdown += \`Evidence indicates that Firestore document access is also rate-limited.\n\n- stop further Firestore testing\n- do not run the exporter\n- do not attempt migration\n- recommend waiting for rate-limit recovery before further production reads\n\`;
              } else if (r1.status === 200 && r2.status === 200) {
                  markdown += \`The previously observed failure is not reproduced by the controlled diagnostic.\n\nRecommend investigating exporter behavior separately before running a full export.\n\`;
              } else if ((r1.status === 408 || r1.status === 504 || r1.status === 503 || r1.status >= 500) && r2.status === 200) {
                  markdown += \`Collection discovery is unreliable while direct document reads remain available.\n\nRecommend bypassing dynamic discovery in the next phase.\n\`;
              } else {
                  markdown += \`Observed mixed or inconclusive results. Test 1 status: \${r1.status}. Test 2 status: \${r2.status}.\n\`;
              }

              fs.writeFileSync('diagnostic_results.md', markdown);
            }
            run().catch(console.error);
          "
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-results
          path: diagnostic_results.md

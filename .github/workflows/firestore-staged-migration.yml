name: Staged Phase 1 Firestore Migration

on:
  workflow_dispatch:
    inputs:
      collections:
        description: "Space-separated list of explicit collections to dump/migrate (Phase 1 supports ONLY settings and events)"
        required: true
        type: string
        default: "settings events"
      dry_run:
        description: "Dry Run (Validate without writing data)"
        required: true
        type: boolean
        default: true
      confirm_production:
        description: "Execute Production Migration (Must uncheck Dry Run and explicitly check this)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  migrate-phase1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify credentials existence
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_JSON" && false)
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || (echo "::error::Missing NEXT_PUBLIC_SUPABASE_URL" && false)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY" && false)

      - name: Execute Staged Dump
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          INPUT_COLLECTIONS: ${{ github.event.inputs.collections }}
        run: |
          echo "Executing dump for collections: $INPUT_COLLECTIONS"
          # shellcheck disable=SC2086  # intentional word-splitting of the list
          npx tsx scripts/dump-firestore-staged.ts $INPUT_COLLECTIONS

      - name: Execute Phase 1 Migration
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_CONFIRM_PRODUCTION: ${{ github.event.inputs.confirm_production }}
        run: |
          ARGS=""
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then
            ARGS="$ARGS --dry-run"
          fi
          if [[ "$INPUT_CONFIRM_PRODUCTION" == "true" ]]; then
            ARGS="$ARGS --confirm-production"
          fi

          echo "Executing migration with args: $ARGS"
          npx tsx scripts/migrate-staged-phase1.ts $ARGS

      - name: Upload Migration Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: migration-phase1-report
          path: MIGRATION_PHASE_1_REPORT.md
          if-no-files-found: ignore

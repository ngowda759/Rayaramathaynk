name: AI loop merge gate

# The autonomous merge stage of the AI development loop.
#
# SECURITY MODEL: like the review workflow this is triggered by `workflow_run`,
# so it holds the base repository's token and secrets. It therefore checks out
# the trusted default branch only, never the pull request head, and runs no
# PR-controlled code. Permissions are the minimum a merge needs — `contents:
# write` and `pull-requests: write` — and nothing else.
#
# The gate re-derives every condition at merge time rather than trusting the
# earlier review, because a push or a label change between approval and merge
# would otherwise be merged on stale evidence. It never bypasses branch
# protection: it arms GitHub's native auto-merge, which merges through the
# protected path.

on:
  workflow_run:
    workflows: [AI loop review]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate and merge
        required: true
        type: string

concurrency:
  group: ai-loop-merge-gate-${{ github.event.workflow_run.head_branch || inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: write
  checks: read
  pull-requests: write

jobs:
  merge-gate:
    name: Merge when every gate passes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the trusted base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Assert the merge gate never runs PR-controlled code
        run: node .ai/scripts/assert-trusted-review.mjs

      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: node .ai/scripts/resolve-review-pr.mjs

      - name: Evaluate the merge gate
        if: ${{ steps.pr.outputs.number != '' }}
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          node .ai/scripts/merge-gate.mjs --pr "${{ steps.pr.outputs.number }}" --json | tee /tmp/gate.json
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report the merge decision
        if: ${{ always() && steps.pr.outputs.number != '' }}
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GATE_STATUS: ${{ steps.gate.outputs.status }}
        run: |
          {
            echo "## Merge gate - PR #${PR_NUMBER}"
            echo
            case "${GATE_STATUS}" in
              0) echo "Every automated gate passed. The merge was armed (or performed)." ;;
              1) echo "The merge was denied. At least one automated gate did not pass." ;;
              3) echo "A human must merge this pull request (protected path or credential change)." ;;
              *) echo "The merge gate did not reach a decision (status ${GATE_STATUS})." ;;
            esac
            echo
            if [ -f /tmp/gate.json ]; then
              echo '```json'
              cat /tmp/gate.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: AI loop validation

# Validates the AI development-loop infrastructure that ships with the
# repository: the loop configuration, its schemas and the machine-readable
# state, plus the structural invariants of every workflow file.
#
# This workflow is deliberately additive. It does not replace CI, it runs no
# product code, needs no secrets, and holds read-only permissions.

on:
  pull_request:
    branches: [main]
    paths:
      - ".ai/**"
      - ".github/workflows/**"
      - "docs/ai-development-loop.md"
      - "docs/tasks/**"
      - ".openhands/skills/**"
      - "tests/unit/ai-loop/**"
  push:
    branches: [main]
    paths:
      - ".ai/**"
      - ".github/workflows/**"
      - "docs/ai-development-loop.md"
      - "docs/tasks/**"
      - ".openhands/skills/**"
      - "tests/unit/ai-loop/**"

concurrency:
  group: ai-loop-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate AI loop config, state and workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate loop configuration and state
        run: node .ai/scripts/validate-loop-config.mjs

      - name: Validate workflow structure
        run: node .ai/scripts/validate-workflows.mjs

      - name: Assert the trusted workflows never run pull-request code
        run: node .ai/scripts/assert-trusted-review.mjs

      - name: Report the loop state
        run: node .ai/scripts/loop-state.mjs status

      - name: Report the task queue
        run: node .ai/scripts/loop-tasks.mjs status

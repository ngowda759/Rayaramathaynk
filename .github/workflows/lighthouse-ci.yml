name: Lighthouse CI Performance Monitoring

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
  workflow_dispatch:
    inputs:
      baseUrl:
        description: 'Base URL to test (e.g., https://example.com)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read
  checks: write
  pages: read
  deployments: write

jobs:
  lighthouse-desktop:
    name: Lighthouse Desktop Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        continue-on-error: true

      - name: Start server
        run: |
          npm run start &
          echo "Waiting for server to start..."
          sleep 10
          curl -s http://localhost:3000 > /dev/null && echo "Server is ready"

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/events
            http://localhost:3000/gallery
            http://localhost:3000/donation
            http://localhost:3000/about
          budgetPath: './lighthouse-budget.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Display summary
        run: |
          echo "## Lighthouse CI Performance Summary (Desktop)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Reports uploaded to temporary public storage." >> $GITHUB_STEP_SUMMARY
          echo "View reports at: https://storage.googleapis.com/lighthouse-ci-reports/" >> $GITHUB_STEP_SUMMARY

  lighthouse-mobile:
    name: Lighthouse Mobile Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        continue-on-error: true

      - name: Start server
        run: |
          npm run start &
          echo "Waiting for server to start..."
          sleep 10
          curl -s http://localhost:3000 > /dev/null && echo "Server is ready"

      - name: Run Mobile Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/events
          budgetPath: './lighthouse-budget-mobile.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
          preset: perf
          settings: |
            --preset=perf
            --throttling-method=simulate
            --screenEmulation.mobile=true
            --screenEmulation.width=375
            --screenEmulation.height=667
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Display summary
        run: |
          echo "## Lighthouse CI Performance Summary (Mobile)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Reports uploaded to temporary public storage." >> $GITHUB_STEP_SUMMARY
